# Cấu hình mô hình (Bước 3-5). --fast dùng bộ tham số nhỏ để chạy thử nhanh.
seed: 42
cv_folds: 5
n_jobs: -1
params:
  rf:   {n_estimators: 150, max_depth: 20, min_samples_leaf: 2, max_features: sqrt}
  et:   {n_estimators: 150, max_depth: 20, min_samples_leaf: 2, max_features: sqrt}
  xgb:  {n_estimators: 300, max_depth: 8, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8, tree_method: hist}
  lgbm: {n_estimators: 400, num_leaves: 63, learning_rate: 0.1, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, verbose: -1}
fast_params:
  rf:   {n_estimators: 30, max_depth: 12}
  et:   {n_estimators: 30, max_depth: 12}
  xgb:  {n_estimators: 60, max_depth: 6}
  lgbm: {n_estimators: 80, num_leaves: 31}
meta:
  C: 10.0             # hồi quy logistic L2 (C lớn = điều chuẩn nhẹ)
explain:
  n_samples: 2000     # số luồng bị gắn cờ được giải thích
  tolerance: 1.0e-3   # sai số cho phép của kiểm tra tính cộng
  n_subsample: 300    # mẫu con cố định của mẫu giải thích (phân tầng theo tên tấn công) cho bước 22 và 24
  baseline_size: 20000  # số vector train để lấy trung vị lành tính (phép xóa bằng trung vị, dùng để đối chiếu)
  top_k: 5            # k của Jaccard top-k khi so hai bộ đóng góp
fast_explain:         # dùng khi chạy --fast
  n_subsample: 60
  baseline_size: 5000
