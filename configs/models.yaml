# Cấu hình mô hình (Bước 3-5). --fast dùng bộ tham số nhỏ để chạy thử nhanh.
seed: 42
cv_folds: 5
n_jobs: -1
train_cap:            # số vector train tối đa (giữ toàn bộ tấn công, lấy mẫu phần Benign)
  unsw: null
  cse: 400000
params:
  rf:   {n_estimators: 150, max_depth: 20, min_samples_leaf: 2, max_features: sqrt}
  et:   {n_estimators: 150, max_depth: 20, min_samples_leaf: 2, max_features: sqrt}
  xgb:  {n_estimators: 300, max_depth: 8, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8, tree_method: hist}
  lgbm: {n_estimators: 400, num_leaves: 63, learning_rate: 0.1, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, verbose: -1}
fast_params:
  rf:   {n_estimators: 30, max_depth: 12}
  et:   {n_estimators: 30, max_depth: 12}
  xgb:  {n_estimators: 60, max_depth: 6}
  lgbm: {n_estimators: 80, num_leaves: 31}
meta:
  C: 10.0             # hồi quy logistic L2 (C lớn = điều chuẩn nhẹ)
explain:
  n_samples: 2000     # số luồng bị gắn cờ được giải thích
  tolerance: 1.0e-3   # sai số cho phép của kiểm tra tính cộng
lime:
  target: logit           # logit: LIME hồi quy trên logit z (cùng thang với SHAP) | proba: LIME phân loại trên xác suất
  n_samples: 300          # số luồng bị gắn cờ được giải thích bằng LIME (con của mẫu SHAP, phân tầng theo tên tấn công)
  num_perturbations: 5000 # số điểm nhiễu quanh mỗi luồng
  background_size: 20000  # số vector train dùng làm nền (thống kê rời rạc hóa, lấy mẫu nhiễu)
  discretizer: quartile   # quartile | decile | none (none = không rời rạc hóa, nhiễu Gaussian quanh luồng)
  kernel_width: null      # null: mặc định của LIME (0,75·√d)
  top_k: 5                # k cho Jaccard/độ khớp dấu
  deletion_ks: [1, 3, 5]  # số đặc trưng bị xóa trong kiểm tra trung thực
  stability: {n_flows: 50, repeats: 5}
lime_per_dataset:         # ghi đè mục lime cho từng dataset; chọn bằng scripts/15_lime_sweep.py (R² mô hình thay thế, không dùng SHAP)
  unsw: {discretizer: quartile}
  cse:  {discretizer: decile}
fast_lime:               # dùng khi chạy --fast
  n_samples: 60
  num_perturbations: 1000
  background_size: 5000
  stability: {n_flows: 20, repeats: 3}
